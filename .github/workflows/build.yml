name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: |
          if ls *.zip >/dev/null 2>&1; then unzip -qo *.zip; fi
          D=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          cd "$D" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GameBooster-apk
          path: "**/outputs/apk/debug/app-debug.apk"
